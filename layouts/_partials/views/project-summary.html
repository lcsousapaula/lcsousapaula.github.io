{{ $item := .item }}
{{ $summary := partial "functions/get_summary" $item }}
<article class="py-5 first:pt-0 last:pb-0">
  <h3 class="text-xl font-semibold tracking-tight text-gray-900 dark:text-white">
    <a class="hover:text-primary-600 dark:hover:text-primary-400" href="{{ $item.RelPermalink }}">{{ $item.Title }}</a>
  </h3>
  <p class="mt-2 text-base leading-relaxed text-gray-700 dark:text-gray-300">{{ $summary | plainify | htmlUnescape }}</p>
  <a class="mt-3 inline-flex items-center text-sm font-medium text-primary-600 hover:text-primary-700 dark:text-primary-400 dark:hover:text-primary-300" href="{{ $item.RelPermalink }}">Explore this theme <span aria-hidden="true" class="ml-1">→</span></a>
</article>
